<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Langkah Baswara - Web-GIS Wisata Bali</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        #map {
            height: 80vh;
            width: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <!-- Header/Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🌴 Langkah Baswara - Web-GIS Bali</span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid mt-3">
        <div class="row">
            <!-- Sidebar (Filter & Controls) -->
            <div class="col-md-3 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Filter Wisata</h5>
                        <p class="card-text text-muted small">Fitur filter akan hadir di Sprint 2 & 3.</p>
                    </div>
                </div>
            </div>
            
            <!-- Map Area -->
            <div class="col-md-9">
                <div id="map" class="shadow-sm"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Inisialisasi Peta Bali -->
    <script>
        // Set koordinat tengah ke Bali (Lat: -8.4095, Lng: 115.1889)
        const map = L.map('map').setView([-8.4095, 115.1889], 10);

        // Tile Layer (Base Map OpenStreetMap)
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
    </script>
</body>
</html>
